spring:
  application:
    name: PP-Farms-Backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:PP-Farms-Backend/.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT}
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS}

supabase:
  url: ${SUPABASE_URL}
  service-key: ${SUPABASE_KEY}
  bucket:
    animals: ${SUPABASE_BUCKET_ANIMALS}
    receipts: ${SUPABASE_BUCKET_RECEIPTS}
    reports: ${SUPABASE_BUCKET_REPORTS}

superadmin:
  email: ${SUPER_ADMIN_EMAIL}
  password: ${SUPER_ADMIN_PASSWORD}
